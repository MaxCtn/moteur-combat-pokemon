name: tests

# Lance la suite Jest a chaque push et chaque pull request sur main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Installer les dependances
        run: npm ci

      - name: Lancer les tests unitaires
        run: npm test
